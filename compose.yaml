services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: capsules
      POSTGRES_USER: capsule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD first}
    ports:
      - "127.0.0.1:5432:5432"
    # При следующем запуске с этим томом нужен тот же пароль.
    volumes:
      - capsule_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capsule -d capsules"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  capsule_data:
